name: Dependabot alert check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      vulnerability-alerts: read

    outputs:
      open_count: ${{ steps.collect.outputs.open_count }}

    steps:
      - name: Collect open alerts
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Consultando alertas abertos do Dependabot..."
          gh api "repos/${{ github.repository }}/dependabot/alerts" \
            --paginate \
            --jq '[.[] | select(.state=="open") | {
              number:            .number,
              ghsa_id:           .security_advisory.ghsa_id,
              severity:          .security_advisory.severity,
              package:           .dependency.package.name,
              vulnerable_range:  .security_vulnerability.vulnerable_version_range,
              patched_version:   .security_vulnerability.first_patched_version.identifier,
              summary:           .security_advisory.summary
            }]' > alerts.json

          OPEN_COUNT=$(jq 'length' alerts.json)
          echo "open_count=$OPEN_COUNT" >> "$GITHUB_OUTPUT"
          echo "Alertas abertos: $OPEN_COUNT"

          jq -r '.[] | [
              .number, .ghsa_id, .severity, .package,
              .vulnerable_range, .patched_version, .summary
            ] | @tsv' alerts.json > alerts.tsv

          echo "### Dependabot Open Alerts" >> "$GITHUB_STEP_SUMMARY"
          echo "| Alert # | GHSA ID | Severity | Package | Vulnerable Range | Patched Version | Summary |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OPEN_COUNT" -gt 0 ]; then
            while IFS=$'\t' read -r num ghsa sev pkg vuln patched sum; do
              echo "| $num | $ghsa | $sev | $pkg | $vuln | $patched | $sum |" >> "$GITHUB_STEP_SUMMARY"
            done < alerts.tsv
          else
            echo "Nenhum alerta aberto encontrado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload alerts artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-alerts
          path: |
            alerts.json
            alerts.tsv
          retention-days: 30
