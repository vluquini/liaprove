name: Code Quality (Qodana)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2024.3
        with:
          args: --linter,jetbrains/qodana-jvm-community:2024.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
